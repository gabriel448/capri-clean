# Push a tag like v1.1.0 (same as "version" in package.json) and this builds the
# Windows installer and publishes it as a GitHub Release. Installed apps pick it up
# on their next launch through electron-updater, which reads latest.yml from the release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag must match package.json
        id: ver
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "tag=v$PKG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "v$PKG" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME != package.json v$PKG"; exit 1
          fi

      - run: npm ci

      # build only; the upload below is done by gh, all files in one go
      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          ls -la dist
          test -f dist/latest.yml
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Capri Clean $TAG" --generate-notes
          gh release upload "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
